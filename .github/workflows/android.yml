# Builds the Play Store app. The Android SDK is preinstalled on GitHub's runners, so the build happens
# here rather than on a laptop. Without the signing secrets it still builds a debug APK you can install
# on a phone to try; with them it produces the signed .aab the Play Console needs.
name: Android

on:
  workflow_dispatch:
  push:
    tags: ["app-v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    # The APK is published as a release below, which needs write access to the repository.
    permissions:
      contents: write
    # `secrets` cannot be read from a step's `if`, so the answer is carried in an env flag.
    env:
      SIGNED: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Restore the signing key
        if: env.SIGNED == 'true'
        working-directory: android
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE" | base64 -d > maktab14.jks
          {
            echo "storeFile=../maktab14.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - name: Build
        working-directory: android
        # The runner's own SDK; no download, no license prompt.
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          chmod +x gradlew
          if [ -f keystore.properties ]; then
            ./gradlew --no-daemon bundleRelease assembleRelease
          else
            ./gradlew --no-daemon assembleDebug
          fi

      - name: Show the signing fingerprint
        if: env.SIGNED == 'true'
        working-directory: android
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          echo "Bu SHA-256 ni Vercel'dagi ANDROID_CERT_SHA256 ga yozing:"
          keytool -list -v -keystore maktab14.jks -alias "$KEY_ALIAS" \
            -storepass "$STORE_PASSWORD" | grep -A1 "SHA256:" | head -2

      - uses: actions/upload-artifact@v4
        with:
          name: maktab14-app
          path: |
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # An Actions artifact is a zip behind a GitHub sign-in and it expires, so it is awkward to install
      # from a phone. A release gives a plain link anyone can open and tap. This is the test build, not
      # what Play distributes: Play re-signs the bundle with its own key.
      - name: Publish the APK for testing
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ github.run_number }}
        run: |
          apk=$(ls android/app/build/outputs/apk/release/*.apk \
                   android/app/build/outputs/apk/debug/*.apk 2>/dev/null | head -1)
          [ -n "$apk" ] || { echo "APK topilmadi"; exit 1; }
          cp "$apk" "maktab14-$RUN.apk"
          gh release create "build-$RUN" "maktab14-$RUN.apk" \
            --repo "$GITHUB_REPOSITORY" --prerelease \
            --title "14-maktab ilovasi — sinov yig'ilmasi $RUN" \
            --notes "Telefonga o'rnatib ko'rish uchun. Play Store'dagi versiya emas: Play ilovani o'z kaliti bilan qayta imzolaydi. O'rnatishda \"Noma'lum manbadan o'rnatish\"ga ruxsat berasiz."

      - name: Remove the key from the runner
        if: always()
        working-directory: android
        run: rm -f maktab14.jks keystore.properties
